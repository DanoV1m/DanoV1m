name: Profile validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [upgrade/profile-command-center]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Offline tests and SVG validation
        run: python3 scripts/telemetry.py --test
      - name: Live telemetry smoke test (read-only, no publishing)
        if: github.repository == 'DanoV1m/DanoV1m' && (github.ref == 'refs/heads/upgrade/profile-command-center' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'upgrade/profile-command-center'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/telemetry.py
          python3 scripts/telemetry.py --test
