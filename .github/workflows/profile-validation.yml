name: Profile validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [upgrade/profile-command-center]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Offline tests and SVG validation
        run: python3 scripts/telemetry.py --test
